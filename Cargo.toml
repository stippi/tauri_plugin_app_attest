[package]
name = "tauri-plugin-app-attest"
version = "0.1.0"
authors = ["Tutor Project"]
description = "Apple App Attest (DCAppAttestService) plugin for Tauri"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
links = "tauri-plugin-app-attest"
keywords = ["tauri", "plugin", "ios", "app-attest", "devicecheck"]
categories = ["api-bindings"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.5" }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.5.2", features = ["build"] }
